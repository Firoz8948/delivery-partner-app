<div class="dp-layout">
  @if (impersonating()) {
    <div class="impersonation-banner" role="status">
      <span>Viewing <strong>{{ user?.full_name }}</strong> as admin</span>
      <button type="button" (click)="exitImpersonation()">Return to Admin</button>
    </div>
  }
  <header class="dp-top">
    <div class="dp-top__brand">
      <img src="assets/images/logo.svg" alt="LalganjEats" />
      <span>Delivery</span>
    </div>
    <div class="dp-top__right">
      <button type="button" class="online" [class.on]="isOnline()" (click)="toggleOnline()">
        {{ isOnline() ? 'Online' : 'Offline' }}
      </button>
      <button type="button" class="logout" (click)="logout()">Logout</button>
    </div>
  </header>

  <main class="dp-main">
    <router-outlet></router-outlet>
  </main>

  <nav class="dp-bottom">
    <a routerLink="/deliverypartner/home" [class.active]="isActive('/deliverypartner/home')">
      <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>
    <a routerLink="/deliverypartner/orders" [class.active]="isActive('/deliverypartner/orders')">
      <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Orders</span>
    </a>
    <a routerLink="/deliverypartner/earnings" [class.active]="isActive('/deliverypartner/earnings')">
      <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Earnings</span>
    </a>
  </nav>
</div>
